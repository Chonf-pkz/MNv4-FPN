name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .[test]
      - name: Unit tests
        run: pytest
      - name: Compile Python sources
        run: python -m compileall -q src scripts runners tools tests
